name: 🐛 Сообщить об ошибке
description: Сообщите о проблеме в FPZone, чтобы мы смогли её воспроизвести и исправить.
title: "[Ошибка]: "
body:
  - type: markdown
    attributes:
      value: |
        Выберите раздел и срочность — после публикации GitHub автоматически назначит лейблы `тип: баг`, выбранный раздел, приоритет и статус `предложено`.

        Перед отправкой удалите из логов пароли, токены, ключи, cookie, идентификаторы сессий и персональные данные.

  - type: dropdown
    id: sections
    attributes:
      label: Разделы
      description: К каким частям FPZone относится ошибка?
      multiple: true
      options:
        - CMS
        - LAUNCHER
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Срочность
      description: Оцените влияние ошибки. Итоговый приоритет может быть изменён командой.
      options:
        - Обычная
        - Важная
        - Срочная
        - Критическая
      default: 0
    validations:
      required: true

  - type: dropdown
    id: product
    attributes:
      label: Где возникла ошибка?
      options:
        - FPZone Launcher
        - Сайт FPZone
        - Установка или обновление игры
        - Запуск игры
        - Достижения
        - Workshop / модификации
        - Сетевая игра
        - Другое
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Версия FPZone
      description: Укажите версию лаунчера или номер сборки, если он известен.
      placeholder: Например, 0.7.1
    validations:
      required: true

  - type: input
    id: game
    attributes:
      label: Игра
      description: Если ошибка связана с конкретной игрой, укажите её название.
      placeholder: Название игры

  - type: textarea
    id: environment
    attributes:
      label: Система
      description: Укажите версию Windows и важные особенности системы.
      placeholder: |
        Windows: Windows 11 24H2
        Архитектура: x64
        Дополнительно:
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Описание ошибки
      description: Что произошло? Укажите точный текст сообщения об ошибке, если он есть.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Как воспроизвести?
      placeholder: |
        1. Открыть FPZone...
        2. Выбрать...
        3. Нажать...
        4. Появляется ошибка...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Ожидаемое поведение
      description: Что должно было произойти вместо ошибки?
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Логи
      description: Вставьте только относящийся к проблеме фрагмент без секретов и персональных данных.
      render: text

  - type: textarea
    id: attachments
    attributes:
      label: Скриншоты или видео
      description: Перетащите сюда материалы, которые помогут понять проблему.

  - type: checkboxes
    id: confirmation
    attributes:
      label: Перед отправкой
      options:
        - label: Я проверил существующие Issues и не нашёл такую же ошибку.
          required: true
        - label: В сообщении нет секретов, персональных данных и закрытых файлов.
          required: true

