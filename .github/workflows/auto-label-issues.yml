name: Автоматические лейблы заявок

on:
  issues:
    types:
      - opened
      - edited
      - reopened

permissions:
  contents: read
  issues: write

jobs:
  labels:
    name: Назначить выбранные лейблы
    runs-on: ubuntu-latest

    steps:
      - name: Получить конфигурацию лейблов
        uses: actions/checkout@v6

      - name: Применить выбор пользователя
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');

            const definitions = JSON.parse(
              fs.readFileSync('.github/labels.json', 'utf8')
            );
            const definitionsByName = new Map(
              definitions.map(label => [label.name.toLowerCase(), label])
            );

            const body = context.payload.issue.body || '';

            function field(label) {
              const escaped = label.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
              const match = body.match(
                new RegExp(`### ${escaped}\\s*\\n+([\\s\\S]*?)(?=\\n### |$)`, 'i')
              );
              return match ? match[1].trim().toUpperCase() : '';
            }

            const sections = field('Разделы');
            const types = field('Тип заявки');
            const priority = field('Срочность');
            const selected = ['статус: предложено'];

            if (body.includes('### Где возникла ошибка?')) {
              selected.push('тип: баг');
            }

            const mappings = [
              [sections, 'CMS', 'раздел: CMS'],
              [sections, 'LAUNCHER', 'раздел: launcher'],
              [types, 'БАГ', 'тип: баг'],
              [types, 'ПРЕДЛОЖЕНИЕ', 'тип: предложение'],
              [types, 'УЛУЧШЕНИЕ', 'тип: улучшение'],
              [types, 'UI / UX', 'тип: UI / UX'],
              [types, 'КОНТЕНТ', 'тип: контент'],
              [types, 'БЕЗОПАСНОСТЬ', 'тип: безопасность'],
              [priority, 'ОБЫЧНАЯ', 'приоритет: обычный'],
              [priority, 'ВАЖНАЯ', 'приоритет: важный'],
              [priority, 'СРОЧНАЯ', 'приоритет: срочный'],
              [priority, 'КРИТИЧЕСКАЯ', 'приоритет: критический']
            ];

            for (const [value, option, label] of mappings) {
              if (value.includes(option)) selected.push(label);
            }

            const existingRepositoryLabels = await github.paginate(
              github.rest.issues.listLabelsForRepo,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100
              }
            );
            const existingNames = new Set(
              existingRepositoryLabels.map(label => label.name.toLowerCase())
            );

            for (const name of selected) {
              if (existingNames.has(name.toLowerCase())) continue;
              const definition = definitionsByName.get(name.toLowerCase());
              if (!definition) throw new Error(`Нет описания лейбла: ${name}`);

              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: definition.name,
                color: definition.color,
                description: definition.description
              });
            }

            const managedPrefixes = [
              'раздел:',
              'тип:',
              'приоритет:'
            ];
            const current = context.payload.issue.labels
              .map(label => typeof label === 'string' ? label : label.name)
              .filter(name => !managedPrefixes.some(prefix =>
                name.toLowerCase().startsWith(prefix)
              ));

            const currentStatus = current.some(name =>
              name.toLowerCase().startsWith('статус:')
            );
            const selectedWithoutDefaultStatus = currentStatus
              ? selected.filter(name => name !== 'статус: предложено')
              : selected;
            const labels = [...new Set([...current, ...selectedWithoutDefaultStatus])];

            await github.rest.issues.setLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels
            });

            core.info(`Назначены лейблы: ${labels.join(', ')}`);
